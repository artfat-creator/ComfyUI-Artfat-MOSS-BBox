[project]
name = "comfyui-artfat-moss-bbox"
description = "Box layouts for MOSS-Image: draw boxes on a canvas to generate a frame where every box holds what you wrote, or to edit only the boxes of an existing picture (outside the boxes stays pixel-identical). Canvas + Sampler, built to sit around an LLM prompter."
version = "1.0.0"
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.9"

[project.urls]
Repository = "https://github.com/artfat-creator/ComfyUI-Artfat-MOSS-BBox"

[tool.comfy]
PublisherId = "artfat-creator"
DisplayName = "Artfat MOSS BBox"
Icon = ""
